services:
  rdgen:
    # 默认：在本机从源码构建，不需要 Docker Hub 账号（群晖 NAS / 自托管）。
    build: .
    # 若改用已发布镜像：注释掉上面 `build: .`，取消下面两行注释
    # image: weststreetboy/rdgen:latest
    # pull_policy: if_not_present
    restart: unless-stopped
    # Every value is required: a missing one halts startup with a clear message
    # instead of failing later when GitHub Actions tries to call back.
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      GHUSER: ${GHUSER:?set GHUSER in .env}
      GHBEARER: ${GHBEARER:?set GHBEARER in .env}
      GENURL: ${GENURL:?set GENURL in .env}
      ZIP_PASSWORD: ${ZIP_PASSWORD:?set ZIP_PASSWORD in .env}
      PROTOCOL: ${PROTOCOL:-https}
      GHBRANCH: ${GHBRANCH:-master}
      REPONAME: ${REPONAME:-rdgen}
      SH_SECRET: ${SH_SECRET:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
    volumes:
      - ./exe:/opt/rdgen/exe
      - ./png:/opt/rdgen/png
      - ./temp_zips:/opt/rdgen/temp_zips
      - ./media:/opt/rdgen/media
      # SQLite keeps state across container restarts. Bind-mounting a file that
      # does not yet exist makes Docker create an (empty) *directory* of that
      # name, which breaks SQLite. A named volume sidesteps that footgun.
      - rdgen_db:/opt/rdgen/db.sqlite3

  # Fixed-domain public access via Cloudflare Named Tunnel (anglestudio.dpdns.org).
  # Only starts with:
  #   docker compose --profile tunnel up -d
  # The tunnel ingress must target http://rdgen:8000 (compose service name,
  # NOT localhost:8000, because localhost is the tunnel container itself).
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - rdgen

volumes:
  rdgen_db:
