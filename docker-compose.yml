services:
  rdgen:
    # 本地构建镜像（不引用外部预构建镜像）
    build: .
    #image: weststreetboy/rdgen:latest
    restart: unless-stopped
    environment:
      SECRET_KEY: "change-me-to-a-random-secret-key"
      GHUSER: "github_username"
      GHBEARER: "github_access_token"
      GENURL: "accessible_url_of_server"
      ZIP_PASSWORD: ""
      GHBRANCH: "master"
      PROTOCOL: "https"
      REPONAME: "rdgen"
      SH_SECRET: ""
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
    volumes:
      - ./exe:/opt/rdgen/exe
      - ./png:/opt/rdgen/png
      - ./temp_zips:/opt/rdgen/temp_zips
