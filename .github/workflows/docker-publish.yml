name: Publish Docker image

# Builds the RDGen image and pushes it to Docker Hub.
# Runs on every push to master (docs-only changes are skipped) and can also be
# triggered manually from the Actions tab.
#
# Required repository secrets (weststreetboy/rdgen -> Settings -> Secrets):
#   DOCKERHUB_USERNAME  your Docker Hub account (keep it 'weststreetboy' so it
#                       matches the image name used in docker-compose.yml)
#   DOCKERHUB_TOKEN     a Docker Hub access token (Account Settings -> Security
#                       -> New Access Token, scope: public_repo)
#
# NOTE: runtime secrets (ZIP_PASSWORD, SECRET_KEY, GHBEARER, GENURL) are NEVER
# baked into the image. They are supplied at runtime via the compose .env file
# or environment variables, and secrets.local.bat / .env are excluded by both
# .gitignore and .dockerignore.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: rdgen

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
